<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 My Custom Homework Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="p-4 md:p-6 bg-gray-100 min-h-screen">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <div id="login-screen" class="p-8 text-center">
            <div class="text-6xl mb-4">🗂️</div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">ระบบจัดการการบ้านสร้างวิชาเอง</h1>
            <p class="text-sm text-gray-500 mb-6">สร้างหัวข้อวิชาเอง แยกหมวดหมู่ชัดเจน แก้ไขและลบงานได้</p>
            
            <input type="text" id="username-input" placeholder="พิมพ์ชื่อเล่นของคุณ..." 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg">
            
            <button onclick="login()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-md">
                เข้าสู่ระบบ 🔑
            </button>
        </div>

        <div id="main-screen" class="hidden">

                <div>
                    <p class="text-xs opacity-75">ผู้ใช้งานระบบ</p>
                    <h2 class="text-xl font-bold" id="user-display">คุณ: </h2>
                </div>
                <button onclick="logout()" class="bg-white/20 hover:bg-white/30 text-xs px-3 py-1.5 rounded-lg transition">
                    ออกจากระบบ 🚪
                </button>
            </div>

            <div class="p-5 border-b border-gray-100 bg-gray-50 space-y-4">

                    <div class="flex gap-2">
                        <input type="text" id="new-subject-input" placeholder="เช่น ฟิสิกส์เพิ่มเติม, บัญชีเบื้องต้น..." 
                               class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="addNewSubject()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-5 rounded-lg font-medium transition">
                            สร้างหัวข้อวิชา ➕
                        </button>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                    <label class="block text-xs font-bold text-gray-700 border-b pb-1">📚 2. มอบหมายการบ้านใหม่:</label>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[11px] text-gray-500 mb-0.5">เลือกหมวดวิชา</label>
                            <select id="subject-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
                                </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[11px] text-gray-500 mb-0.5">รายละเอียดการบ้าน</label>
                            <input type="text" id="task-input" placeholder="เช่น ทำแบบฝึกหัดข้อ 1-5 หน้า 40..." 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="md:col-span-2">
                            <label class="block text-[11px] text-gray-500 mb-0.5">หมายเหตุ</label>
                            <input type="text" id="note-input" placeholder="เช่น ส่งก่อนเที่ยง, งานกลุ่มทำคู่กับบี..." 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-[11px] text-gray-500 mb-0.5">กำหนดส่ง</label>
