<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Homework Tracker Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f0f2f5; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <div id="login-screen" class="p-8 text-center">
            <div class="text-5xl mb-4">📚</div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">ระบบเช็คลิสต์การบ้าน</h1>
            <p class="text-sm text-gray-500 mb-6">กรอกชื่อของคุณเพื่อเข้าสู่หน้าการบ้านส่วนตัว</p>
            
            <input type="text" id="username-input" placeholder="พิมพ์ชื่อของคุณที่นี่..." 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg">
            
            <button onclick="login()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-md">
                เข้าสู่ระบบ 🚀
            </button>
        </div>

        <div id="main-screen" class="hidden">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white flex justify-between items-center">
                <div>
                    <p class="text-xs opacity-75">ยินดีต้อนรับ</p>
                    <h2 class="text-xl font-bold" id="user-display">คุณ: </h2>
                </div>
                <button onclick="logout()" class="bg-white/20 hover:bg-white/30 text-xs px-3 py-1.5 rounded-lg transition">
                    สลับบัญชี 🚪
                </button>
            </div>

            <div class="p-6 border-b border-gray-100 bg-gray-50">
                <h3 class="text-sm font-semibold text-gray-700 mb-3">➕ เพิ่มการบ้านใหม่</h3>
                <div class="space-y-3">
                    <input type="text" id="task-input" placeholder="ชื่อวิชา หรือ รายละเอียดงาน..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">กำหนดส่ง</label>
                            <input type="date" id="date-input" 
                                   class="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="flex items-end">
                            <button onclick="addHomework()" 
                                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm transition shadow">
                                เพิ่มงาน ✨
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6">
                <h3 class="text-sm font-semibold text-gray-700 mb-3 flex justify-between">
                    <span>📋 รายการงานของคุณ</span>
                    <span id="task-count" class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full">0 งาน</span>
                </h3>
                
                <div id="empty-state" class="text-center py-8 text-gray-400 text-sm">
                    🎉 ยินดีด้วย ตอนนี้ไม่มีการบ้านค้างเลย!
                </div>

                <ul id="homework-list" class="space-y-2.5"></ul>
            </div>
        </div>

    </div>

    <script>
        let currentUser = "";
        let homeworkData = JSON.parse(localStorage.getItem("homework_db")) || [];

        // ฟังก์ชันล็อกอิน
        function login() {
            const username = document.getElementById("username-input").value.trim();
            if (!username) {
                alert("กรุณาใส่ชื่อของคุณก่อนนะ!");
                return;
            }
            currentUser = username;
            document.getElementById("user-display").innerText = `คุณ: ${currentUser}`;
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-screen").classList.remove("hidden");
            renderTasks();
        }

        // ฟังก์ชันล็อกเอาท์
        function logout() {
            currentUser = "";
            document.getElementById("username-input").value = "";
            document.getElementById("login-screen").classList.remove("hidden");
            document.getElementById("main-screen").classList.add("hidden");
        }

        // ฟังก์ชันเพิ่มการบ้าน
        function addHomework() {
            const taskText = document.getElementById("task-input").value.trim();
            const dueDate = document.getElementById("date-input").value;

            if (!taskText) {
                alert("กรุณากรอกรายละเอียดการบ้านด้วยครับ");
                return;
            }

            const newId = Date.now();
            homeworkData.push({
                id: newId,
                user: currentUser,
                task: taskText,
                date: dueDate ? dueDate : "ไม่ระบุวันส่ง"
            });

            saveToLocalStorage();
            renderTasks();

            // ล้างค่าในช่องกรอก
            document.getElementById("task-input").value = "";
            document.getElementById("date-input").value = "";
        }

        // ฟังก์ชันลบงาน (เมื่อทำเสร็จแล้ว)
        function deleteTask(id) {
            homeworkData = homeworkData.filter(item => item.id !== id);
            saveToLocalStorage();
            renderTasks();
        }

        // ฟังก์ชันบันทึกข้อมูลลงบราวเซอร์
        function saveToLocalStorage() {
            localStorage.setItem("homework_db", JSON.stringify(homeworkData));
        }

        // ฟังก์ชันวาดรายการงานขึ้นหน้าจอ (คัดกรองเฉพาะของคนที่ล็อกอิน)
        function renderTasks() {
            const listContainer = document.getElementById("homework-list");
            const emptyState = document.getElementById("empty-state");
            const countBadge = document.getElementById("task-count");
            
            listContainer.innerHTML = "";

            // กรองเอาเฉพาะงานที่เป็นของ User ที่ล็อกอินอยู่
            const myTasks = homeworkData.filter(item => item.user === currentUser);
            countBadge.innerText = `${myTasks.length} งาน`;

            if (myTasks.length === 0) {
                emptyState.classList.remove("hidden");
            } else {
                emptyState.classList.add("hidden");

                myTasks.forEach(item => {
                    const li = document.createElement("li");
                    li.className = "flex items-center justify-between bg-gray-50 border border-gray-200 p-3 rounded-xl hover:bg-gray-100 transition group";
                    li.innerHTML = `
                        <div class="flex-1 min-w-0 pr-2">
                            <p class="text-sm font-medium text-gray-800 break-words">${item.task}</p>
                            <p class="text-xs text-rose-500 font-light mt-0.5">📅 ส่งภายใน: ${item.date}</p>
                        </div>
                        <button onclick="deleteTask(${item.id})" 
                                class="bg-gray-200 hover:bg-emerald-500 hover:text-white text-gray-500 w-7 h-7 rounded-full flex items-center justify-center text-xs transition-colors shrink-0"
                                title="ทำเสร็จแล้ว">
                            ✓
                        </button>
                    `;
                    listContainer.appendChild(li);
                });
            }
        }
    </script>
</body>
</html>
