<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ ENGINE v9.0 - Firebase Real-Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="p-4 md:p-6 bg-stone-100 min-h-screen text-stone-800">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-stone-200">
        
        <div id="login-screen" class="p-8 text-center bg-stone-50">
            <div class="w-24 h-24 mx-auto mb-6 flex items-center justify-center bg-orange-500 rounded-2xl shadow-lg text-5xl text-white">⚙️</div>
            <h1 class="text-2xl font-extrabold text-orange-600 mb-2">ขี้เกียจทำการบ้านโว้ยยย v9.0 🛠️</h1>
            <p class="text-sm text-stone-600 mb-8">ระบบล็อกอินเชื่อมตรง Firebase Authentication + Firestore Database จำข้อมูลถาวร</p>
            
            <button onclick="loginWithGoogle()" id="login-btn"
                    class="w-full max-w-md mx-auto flex items-center justify-center gap-3 bg-white border border-stone-300 hover:bg-stone-50 text-stone-700 font-bold py-3 px-4 rounded-xl transition shadow-sm text-sm">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
                Sign in with Google หลังบ้านแท้ ⚡
            </button>
        </div>

        <div id="main-screen" class="hidden">
            <div class="bg-gradient-to-r from-orange-500 to-amber-500 p-5 text-white flex justify-between items-center font-semibold">
                <div class="flex items-center gap-3">
                    <img id="user-avatar" src="" class="w-9 h-9 rounded-full border-2 border-white/50" alt="Avatar">
                    <div>
                        <p class="text-[10px] text-orange-100 font-mono">FIRESTORE AUTH:</p>
                        <h2 class="text-xs font-bold" id="user-display">Loading...</h2>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="sync-status" class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded font-mono">ONLINE</span>
                    <button onclick="logoutWithGoogle()" class="bg-stone-900/20 text-xs px-2.5 py-1 rounded-lg border border-white/20">ออกระบบ 🚪</button>
                </div>
            </div>

            <div class="p-5 border-b border-stone-200 bg-stone-50 space-y-4">
                <div class="bg-white p-4 rounded-xl border border-stone-200 shadow-sm">
                    <label class="block text-xs font-bold text-stone-600 mb-1.5">📐 1. เพิ่มรายวิชา:</label>
                    <div class="flex gap-2">
                        <input type="text" id="new-subject-input" placeholder="เช่น กลศาสตร์, Drawing..." class="flex-1 px-3 py-1.5 bg-white border border-stone-300 rounded-lg text-sm">
                        <button onclick="addNewSubject()" class="bg-stone-700 hover:bg-stone-800 text-white text-xs px-4 rounded-lg font-bold">สร้างวิชา ➕</button>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl border border-stone-200 shadow-sm space-y-3">
                    <label class="block text-xs font-bold text-orange-600 border-b pb-1">📦 2. เพิ่มการบ้านเซฟลง Firestore:</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[11px] text-stone-500">เลือกวิชา</label>
                            <select id="subject-select" class="w-full px-3 py-1.5 bg-stone-50 border border-stone-300 rounded-lg text-sm"></select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-[11px] text-stone-500">รายละเอียดงาน</label>
                            <input type="text" id="task-input" placeholder="สั่งงานอะไรมา..." class="w-full px-3 py-1.5 bg-white border border-stone-300 rounded-lg text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="md:col-span-2">
                            <label class="block text-[11px] text-stone-500">หมายเหตุ</label>
                            <input type="text" id="note-input" placeholder="งานกลุ่ม/เดี่ยว..." class="w-full px-3 py-1.5 bg-white border border-stone-300 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] text-stone-500">📅 เดดไลน์</label>
                            <input type="date" id="date-input" class="w-full px-3 py-1 bg-white border border-stone-300 rounded-lg text-sm">
                        </div>
                    </div>
                    <button onclick="addHomework()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-lg text-sm transition">ส่งงานขึ้นคลาวด์ Google 🚀</button>
                </div>
            </div>

            <div class="p-5 space-y-4">
                <h2 class="text-sm font-extrabold text-stone-700 flex justify-between items-center">
                    <span>🔥 งานค้างในบัญชีของคุณ</span>
                    <span id="total-pending-badge" class="bg-orange-100 text-orange-700 text-xs px-2 py-0.5 rounded-full font-bold">0 TASKS</span>
                </h2>
                <div id="subjects-container" class="space-y-4"></div>
            </div>

            <div class="p-5 bg-stone-100 border-t border-stone-200">
                <h3 class="text-xs font-bold text-emerald-600 mb-2" id="history-count">✅ รอดตายแล้ว (0 RESOLVED)</h3>
                <div id="history-empty" class="text-center py-4 text-stone-400 text-xs italic">ยังไม่มีประวัติการส่งงาน</div>
                <ul id="history-list" class="space-y-1.5"></ul>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ [สำคัญมาก] แก้ไขค่าตรงนี้ให้เป็นของคลาวด์ Firebase พี่เอง (ดูวิธีทำในขั้นตอนที่ 2 ด้านล่าง)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let uid = "";
        let homeworkData = [];
        let subjectsList = [];

        window.showStatus = function(text, isPulse = false) {
            const el = document.getElementById("sync-status");
            if(el) { el.innerText = text; el.className = `text-xs px-2 py-0.5 rounded font-mono text-white ${isPulse ? 'bg-amber-500 animate-pulse' : 'bg-emerald-600'}`; }
        }

        async function loadCloudData() {
            window.showStatus("LOADING...", true);
            try {
                const docSnap = await getDoc(doc(db, "users_homework", uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    subjectsList = data.subjectsList || [];
                    homeworkData = data.homeworkData || [];
                }
            } catch (e) { console.error(e); }
            window.showStatus("SYNCED");
            updateSubjectDropdown();
            renderSections();
        }

        window.saveCloudData = async function() {
            window.showStatus("SAVING...", true);
            try {
                await setDoc(doc(db, "users_homework", uid), { subjectsList, homeworkData });
            } catch (e) { console.error(e); }
            window.showStatus("SYNCED");
        }

        window.loginWithGoogle = async function() {
            try { await signInWithPopup(auth, provider); } catch (e) { alert("ล็อกอินล้มเหลว ตรวจสอบการตั้งค่าหลังบ้าน!"); }
        }

        window.logoutWithGoogle = async function() { if(confirm("ออกจากระบบใช่ไหม?")) await signOut(auth); }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                uid = user.uid;
                document.getElementById("user-avatar").src = user.photoURL || "";
                document.getElementById("user-display").innerText = `${user.displayName} (${user.email})`;
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("main-screen").classList.remove("hidden");
                await loadCloudData();
            } else {
                uid = "";
                document.getElementById("login-screen").classList.remove("hidden");
                document.getElementById("main-screen").classList.add("hidden");
            }
        });

        // ฟังก์ชันการทำงานของแอปพลิเคชัน
        window.addNewSubject = async function() {
            const val = document.getElementById("new-subject-input").value.trim();
            if (!val || subjectsList.includes(val)) return;
            subjectsList.push(val);
            document.getElementById("new-subject-input").value = "";
            updateSubjectDropdown(); renderSections(); await window.saveCloudData();
        }

        window.deleteSubject = async function(name) {
            if(!confirm(`ลบวิชา "${name}" งานข้างในจะหายหมด?`)) return;
            subjectsList = subjectsList.filter(s => s !== name);
            homeworkData = homeworkData.filter(i => i.subject !== name);
            updateSubjectDropdown(); renderSections(); await window.saveCloudData();
        }

        function updateSubjectDropdown() {
            const el = document.getElementById("subject-select"); el.innerHTML = "";
            if(subjectsList.length === 0) { el.innerHTML = "<option>-- สร้างวิชาก่อน --</option>"; return; }
            subjectsList.forEach(s => { const o = document.createElement("option"); o.value = s; o.innerText = s; el.appendChild(o); });
        }

        window.addHomework = async function() {
            const sub = document.getElementById("subject-select").value;
            const task = document.getElementById("task-input").value.trim();
            if (subjectsList.length === 0 || !task) return;
            homeworkData.push({
                id: Date.now(), subject: sub, task,
                note: document.getElementById("note-input").value.trim() || "ไม่มีหมายเหตุ",
                date: document.getElementById("date-input").value || "ไม่มีเดดไลน์", done: false
            });
            document.getElementById("task-input").value = "";
            document.getElementById("note-input").value = "";
            renderSections(); await window.saveCloudData();
        }

        window.deleteTask = async function(id) {
            homeworkData = homeworkData.filter(i => i.id !== id);
            renderSections(); await window.saveCloudData();
        }

        window.completeTask = async function(id) {
            const idx = homeworkData.findIndex(i => i.id === id);
            if (idx > -1) homeworkData[idx].done = true;
            renderSections(); await window.saveCloudData();
        }

        function renderSections() {
            const container = document.getElementById("subjects-container");
            const histList = document.getElementById("history-list");
            container.innerHTML = ""; histList.innerHTML = "";
            
            const pending = homeworkData.filter(i => !i.done);
            const done = homeworkData.filter(i => i.done);
            
            document.getElementById("total-pending-badge").innerText = `${pending.length} TASKS`;
            document.getElementById("history-count").innerText = `✅ รอดตายแล้ว (${done.length} RESOLVED)`;
            
            if(done.length > 0) document.getElementById("history-empty").classList.add("hidden");
            else document.getElementById("history-empty").classList.remove("hidden");

            subjectsList.forEach(sub => {
                const subTasks = pending.filter(t => t.subject === sub);
                const box = document.createElement("div");
                box.className = "bg-stone-50 border p-3 rounded-xl space-y-2";
                box.innerHTML = `<div class="flex justify-between border-b pb-1"><span class="text-xs font-bold">📘 ${sub} (${subTasks.length})</span><button onclick="deleteSubject('${sub}')" class="text-stone-400 text-[11px] hover:text-red-500">ทุบวิชา</button></div>`;
                
                const ul = document.createElement("ul");
                subTasks.forEach(item => {
                    const li = document.createElement("li");
                    li.className = "flex justify-between bg-white border p-2 rounded-lg text-xs";
                    li.innerHTML = `<div class="min-w-0 flex-1"><b>${item.task}</b><p class="text-stone-500 text-[10px]">${item.note}</p><p class="text-red-500 text-[10px]">📅 ${item.date}</p></div>
                                    <div class="flex gap-1 items-center"><button onclick="deleteTask(${item.id})" class="text-stone-400 px-1">ลบ</button><button onclick="completeTask(${item.id})" class="bg-orange-500 text-white w-5 h-5 rounded-full text-[10px]">✓</button></div>`;
                    ul.appendChild(li);
                });
                box.appendChild(ul); container.appendChild(box);
            });

            done.forEach(item => {
                const li = document.createElement("li"); li.className = "text-xs text-stone-400 line-through bg-white border p-2 rounded-lg";
                li.innerText = `[${item.subject}] ${item.task}`; histList.appendChild(li);
            });
        }
    </script>
</body>
</html>
